version: "1"
kind: miner
# Self-assigned and must be unused: requests route on it (/engine/v1/ask/{id}).
# Checked free against all 129 active miners on 2026-09-05.
id: 84532
slug: zengawd-transaction-guard
protocol: generic
name: Zengawd Transaction Guard
description: >
  Scores an EVM contract, wallet or dApp URL for transaction risk. Calldata is decoded locally, on-chain facts are read
  from RPC, and the result is a composite 0-100 risk score with an ALLOW / WARN / BLOCK label whose keccak256 hash is
  recorded on Base Sepolia in ZengawdPolicy. Answers are served from the verdict store when fresh, so identical
  questions do not re-run the pipeline.

base_url: https://zengawd-web.vercel.app

docs:
  website: https://zengawd-web.vercel.app
  documentation: https://zengawd-web.vercel.app
  repository: https://github.com/SKAHLO1/zengawd

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 300
circuit_threshold: 3
circuit_cooldown_seconds: 60

endpoints:
  - path: /api/telegraph/ask
    external_path: /api/telegraph/ask
    method: POST
    description: >
      Score one EVM subject for transaction risk. Give it a contract address, a wallet address or a dApp URL and it
      returns ALLOW / WARN / BLOCK with a 0-100 risk score, a plain-English reason, and the hash of the verdict as
      recorded on Base Sepolia. Answers a question like "is this token safe to approve" or "is this contract a scam".
      Returns INSUFFICIENT_SIGNAL rather than guessing when too few signals are available.
    intents: [FRAUD_DETECTION]
    content_type: application/json
    params:
      body:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: >
              The risk question in plain language, naming the subject to evaluate, e.g. "Is
              0xdAC17F958D2ee523a2206206994597C13D831ec7 safe to approve on Ethereum mainnet?". When `target` is
              absent the subject is parsed out of this text, so it must contain a 0x address or an http(s) URL.
        optional:
          - name: target
            type: string
            intents: ["*"]
            description: >
              The subject to evaluate, as a 0x-prefixed 40-hex EVM address or an http(s) URL. Overrides whatever the
              query names. Anything else is rejected with HTTP 400.
          - name: chainId
            type: integer
            intents: ["*"]
            description: >
              EVM chain id the subject lives on. Defaults to 1 (Ethereum). Supported: 1, 8453 (Base) and 84532
              (Base Sepolia). Passing an address that is not deployed on the given chain yields INSUFFICIENT_SIGNAL.
          - name: from
            type: string
            intents: ["*"]
            description: >
              The wallet that would sign the transaction, as a 0x-prefixed 40-hex address. Optional; defaults to the
              zero address. Supplying it enables counterparty-balance signals.

input_schema:
  type: object
  required:
    - query
  properties:
    query:
      type: string
      description: Free-form risk question. The subject is read from this when `target` is absent.
    target:
      type: string
      description: Contract address, wallet address or dApp URL to evaluate. Overrides whatever the query names.
    chainId:
      type: integer
      description: EVM chain id. Defaults to 1. Supported chains are 1, 8453 and 84532.
    from:
      type: string
      description: Wallet that would sign the transaction, when known. Defaults to the zero address.

output_schema:
  type: object
  required:
    - label
    - confidence
    - reason
  properties:
    intent:
      type: string
      description: Always TRANSACTION_RISK_ASSESSMENT.
    label:
      type: string
      description: ALLOW, WARN, BLOCK or INSUFFICIENT_SIGNAL.
    score:
      type: number
      description: Composite risk, 0 (safe) to 100 (hostile). Null when the label is INSUFFICIENT_SIGNAL.
    confidence:
      type: number
      description: 0-1 evidence coverage - the share of applicable signals that actually returned.
    reason:
      type: string
      description: Plain-English rationale drawn from the contributing signals.
    target:
      type: string
      description: The subject that was evaluated.
    chainId:
      type: integer
      description: Chain the subject was evaluated on.
    signalCount:
      type: integer
      description: Number of signals that returned usable evidence.
    verdictHash:
      type: string
      description: keccak256 of the canonical verdict JSON.
    attestationTx:
      type: string
      description: Base Sepolia transaction recording the verdict, when attestation is configured.
    cached:
      type: boolean
      description: True when served from a stored verdict rather than a fresh run.
    ageSeconds:
      type: integer
      description: Age of the served verdict in seconds. 0 for a fresh run.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: label
    reason_field: reason
  supported_intents:
    - FRAUD_DETECTION
